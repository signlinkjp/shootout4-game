# SHOOTOUT 4 iOS TestFlight Build 7
# ============================================================
# SHOOTOUT 4 v1.0.0（Build 7）を TestFlight へ配信するワークフロー。
# トモアキさんが Safari で GitHub に貼り付ける用（DOROKEI / JANKeN PoN と同じ手順）。
#
# 置き場所（新リポジトリ）:
#   .github/workflows/ios-testflight.yml
#
# ★ GitHub 連携の権限ではワークフローファイルを直接 push できないため、
#   このファイルの中身をそのままコピーして GitHub の画面で貼り付けてください。
#   1行目は必ず「# 」で始まる YAML コメントのままにしてください。
#
# 使い方:
#   Actions →「SHOOTOUT 4 iOS TestFlight」→ Run workflow
#     - confirm_bundle_id に `jp.signlink.Shootout4`
#     - upload_to_testflight は true（TestFlight へ配信）
#
# ★ ビルド番号はこのファイルに書きません。
#   ios/App/App.xcodeproj/project.pbxproj の CURRENT_PROJECT_VERSION を
#   そのまま読み取って使います（MARKETING_VERSION も同じ）。
#   Build 8 にするときは pbxproj の番号を 8 に上げるだけです。
#
# 必要な Secrets（既存リポジトリと同じ値）:
#   APPLE_TEAM_ID                   … 例 TGBNH8WJV6
#   APPSTORE_CONNECT_KEY_ID         … App Store Connect API キーの Key ID（ASC_API_KEY_ID でも可）
#   APPSTORE_CONNECT_ISSUER_ID      … Issuer ID（ASC_API_ISSUER_ID でも可）
#   APPSTORE_CONNECT_PRIVATE_KEY    … AuthKey_*.p8 の中身（ASC_API_KEY_P8 でも可）
# ============================================================

name: SHOOTOUT 4 iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_bundle_id:
        description: "確認のため bundle ID を入力: jp.signlink.Shootout4"
        required: true
        type: string
        default: "jp.signlink.Shootout4"
      upload_to_testflight:
        description: "TestFlight へアップロードする（false = 署名済みIPAの作成まで）"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shootout4-ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.signlink.Shootout4
  APP_NAME: SHOOTOUT 4
  PBXPROJ: ios/App/App.xcodeproj/project.pbxproj

jobs:
  preflight:
    name: Web preflight（テスト・構成・3D・iOSの契約）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm run intent
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm_bundle_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "$BUNDLE_ID"

      - name: Read the build number from the iOS project
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER" || { echo "::error::pbxproj に CURRENT_PROJECT_VERSION がありません"; exit 1; }
          test -n "$MARKETING_VERSION" || { echo "::error::pbxproj に MARKETING_VERSION がありません"; exit 1; }
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "ビルド番号: $BUILD_NUMBER / 表示バージョン: $MARKETING_VERSION"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run the SHOOTOUT 4 unit tests
        run: npm test

      - name: Guard the game rules (7秒・4択・5本・サドンデス・能力差ゼロ)
        run: |
          set -euo pipefail
          for file in src/main.js src/i18n.js src/audio.js src/storage.js src/platform/iap.js \
                      src/net/online.js src/net/realtime.js src/core/rules.js src/core/cpu.js \
                      src/core/skins.js src/core/countries.js src/three/stadium.js src/three/textures.js; do
            node --check "$file"
          done
          grep -q "DIRECTIONS = Object.freeze(\['TL', 'TR', 'BL', 'BR'\])" src/core/rules.js
          grep -q 'KICKERS = 5' src/core/rules.js
          grep -q 'export function decidedWinner' src/core/rules.js
          grep -q "roundSeconds: 7" src/config.js
          grep -q 'confirmKick' src/main.js
          grep -q 'id="timer-fill"' src/ui/match.js
          grep -q 'data-dir="TL"' src/ui/match.js
          grep -q 'export function pkBoard' src/core/rules.js
          # 能力差ゼロ（キット・スパイクに強さの値が無い）
          ! grep -qE "(power|accuracy|rating|bonus)[[:space:]]*:" src/core/skins.js
          echo "rules OK"

      - name: Guard the 3D stadium (vendored Three.js, no CDN)
        run: |
          set -euo pipefail
          test -f vendor/three.module.min.js
          test $(wc -c < vendor/three.module.min.js) -gt 300000
          ! grep -rqE "unpkg\.com|cdn\.jsdelivr|three@[0-9]" src/ index.html
          grep -q "from '../../vendor/three.module.min.js'" src/three/stadium.js
          grep -q 'InstancedMesh' src/three/stadium.js
          grep -q 'netWave' src/three/stadium.js
          grep -q 'confetti' src/three/stadium.js
          grep -q 'floodlights' src/three/stadium.js
          echo "3D OK"

      - name: Guard the national teams, PRO and 12 languages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          countries = pathlib.Path('src/core/countries.js').read_text()
          codes = re.findall(r"code: '([A-Z]{2})'", countries)
          assert len(codes) == 32, codes   # 無料16 + PRO16（ワールドカップ風）
          assert len(set(codes)) == 32
          print('countries:', ' '.join(codes))
          PY
          grep -q "pro: 'jp.signlink.Shootout4.pro'" src/config.js
          grep -q "proPrice: '¥300'" src/config.js
          grep -q 'export function canPlayWorld\|canUseLevel\|PRODUCT_ID' src/platform/iap.js
          grep -q 'zh-Hant' src/i18n.js
          grep -q 'Bahasa Indonesia' src/i18n.js
          grep -q "CFBundleDevelopmentRegion" ios/App/App/Info.plist
          grep -q 'https://siivncidktbuyqwsjeqd.supabase.co' src/config.js
          grep -q 'shootout-quick' src/net/online.js
          ! grep -qi '<textarea' index.html
          grep -q -- '-webkit-touch-callout' styles.css
          grep -q 'env(safe-area-inset-top' styles.css
          grep -q 'data-size="standard"' index.html
          echo "countries / PRO / i18n OK"

      - name: Check the app icons (1024 RGB, no alpha)
        run: |
          python3 - <<'PY'
          import pathlib, struct
          paths = ['assets/icon-1024.png',
                   'ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png']
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              assert data[:4] == b'\x89PNG', path
              width, height = struct.unpack('>II', data[16:24])
              depth, color = data[24], data[25]
              assert (width, height) == (1024, 1024), (path, width, height)
              assert (depth, color) == (8, 2), (path, depth, color)  # RGB, no alpha
          print('icons OK')
          PY

      - name: Guard the iOS project contract
        run: |
          set -euo pipefail
          node tools/verify-ios-project.mjs

      - name: Build the distributable www
        run: |
          set -euo pipefail
          node tools/make-www.mjs
          test -f www/index.html
          test -f www/src/main.js
          test -f www/src/net/online.js
          test -f www/vendor/three.module.min.js
          test -f www/assets/icon-1024.png
          echo "web assets OK"

  testflight:
    name: Xcode で署名 → IPA → TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'TGBNH8WJV6' }}
      ASC_KEY_ID: ${{ secrets.ASC_ADMIN_AB_KEY_ID || secrets.APPSTORE_CONNECT_KEY_ID || secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ADMIN_AB_ISSUER_ID || secrets.APPSTORE_CONNECT_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_ADMIN_AB_KEY_P8_BASE64 || secrets.APPSTORE_CONNECT_PRIVATE_KEY || secrets.ASC_API_KEY_P8 }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the build number from the iOS project
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER"
          test -n "$MARKETING_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"

      - name: Verify Apple secret contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEAM_ID" || { echo "::error::APPLE_TEAM_ID が未設定です"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error::APPSTORE_CONNECT_KEY_ID（または ASC_API_KEY_ID）が未設定です"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::APPSTORE_CONNECT_ISSUER_ID（または ASC_API_ISSUER_ID）が未設定です"; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "::error::APPSTORE_CONNECT_PRIVATE_KEY（または ASC_API_KEY_P8）が未設定です"; exit 1; }
          echo "Secrets present."

      - name: Xcode environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write the App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          export AUTH_KEY_PATH
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ["ASC_PRIVATE_KEY"]
          value = value.lstrip("\ufeff").replace("\r\n", "\n").replace("\r", "\n").strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
              value = value[1:-1].strip()
          if "\\n" in value and "\n" not in value:
              value = value.replace("\\n", "\n")
          if "-----BEGIN" not in value:
              try:
                  decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
                  if "-----BEGIN" in decoded:
                      value = decoded.strip()
              except Exception:
                  pass
          Path(os.environ["AUTH_KEY_PATH"]).write_text(value + "\n", encoding="utf-8")
          PY
          chmod 600 "$AUTH_KEY_PATH"
          if ! openssl pkey -in "$AUTH_KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY が正しい .p8（PEM秘密鍵）ではありません。AuthKey_*.p8 の中身を丸ごとコピーしてください。"
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build www and sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node tools/make-www.mjs
          npx cap sync ios
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/src/main.js
          test -f ios/App/App/public/src/net/online.js
          test -f ios/App/App/public/src/three/stadium.js
          test -f ios/App/App/public/vendor/three.module.min.js
          test -f ios/App/App/public/assets/icon-1024.png
          grep -q 'SHOOTOUT 4' ios/App/App/public/index.html
          grep -q 'safe-area-inset-top' ios/App/App/public/styles.css
          echo "Capacitor sync OK"

      - name: Archive (Xcode cloud signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/release/SHOOTOUT4.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive | tee build/release/archive.log

      - name: Prove the PRO plugin and audio bridge are in the binary
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/release/SHOOTOUT4.xcarchive/Products/Applications/App.app/App"
          test -f "$APP"
          strings "$APP" | grep -q "jp.signlink.Shootout4.pro" \
            || { echo "::error::PRO の商品IDがバイナリに入っていません"; exit 1; }
          strings "$APP" | grep -q "ShootoutAudio" \
            || { echo "::error::音のブリッジ（ShootoutAudio）がバイナリに入っていません"; exit 1; }
          echo "StoreKit product id and ShootoutAudio bridge present in the binary"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/release/SHOOTOUT4.xcarchive" \
            -exportPath "$PWD/build/release/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/release/export.log
          IPA_PATH=$(find "$PWD/build/release/export" -maxdepth 1 -name "*.ipa" -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA_PATH" | tee build/release/IPA_SHA256.txt

      - name: Validate the IPA with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-validate.json

      - name: Upload to TestFlight
        if: ${{ env.UPLOAD == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-upload.json

      - name: Keep the build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shootout4-testflight-build1-evidence
          path: |
            build/release/*.log
            build/release/*.json
            build/release/IPA_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
